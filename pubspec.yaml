name: fit_mirror_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  firebase_auth: ^5.1.0
  firebase_core: ^3.1.0
  google_sign_in: ^6.2.1
  curved_navigation_bar: ^1.0.6
  http: ^1.1.0
  cloud_firestore: ^5.0.1
  google_generative_ai: ^0.4.5
  flutter_dotenv: ^5.1.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/Brands/
    - assets/Brands/Ideas/
    - assets/Brands/Outfitters/
    - assets/Brands/ChaseValue/
    - assets/Brands/Breakout/


